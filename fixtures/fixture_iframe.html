<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Iframe Context Switch Fixture</title>
<style>
  body{font-family:sans-serif;margin:40px}
  #inner-frame{width:420px;height:120px;border:2px solid #17a2b8;border-radius:6px;margin:16px 0}
  #outer-read-btn{padding:8px 18px;font-size:15px}
  #outer-status{margin-top:14px;color:#28a745;font-weight:bold;min-height:22px}
</style>
</head>
<body>
<h3>外层页面（主文档上下文）</h3>

<iframe id="inner-frame" srcdoc="<!DOCTYPE html><html><head><meta charset='utf-8'><style>body{font-family:sans-serif;padding:12px}</style></head><body><p>这是 iframe 内部</p><input id='inner-input' type='text' placeholder='在 iframe 内输入'></body></html>"></iframe>

<button id="outer-read-btn" onclick="readFromFrame()">Read From Iframe（外层按钮）</button>
<div id="outer-status">waiting…</div>

<script>
  // 外层按钮：从 iframe 帧上下文读取输入框的值
  function readFromFrame() {
    var v = document.getElementById('inner-frame').contentDocument
      .getElementById('inner-input').value;
    document.getElementById('outer-status').textContent =
      '外层按钮已从 iframe 读取到文本: "' + v + '"';
  }
</script>
</body>
</html>

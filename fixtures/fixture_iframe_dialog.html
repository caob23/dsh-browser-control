<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Iframe Dialog Fixture</title>
<style>body{font-family:system-ui;padding:24px}iframe{width:420px;height:110px;border:2px solid #17a2b8}
#log{background:#f4f4f4;border:1px solid #ccc;padding:10px;margin-top:14px;font-family:monospace;white-space:pre-wrap}</style>
</head>
<body>
<h2>Iframe Dialog Test</h2>
<iframe id="f" srcdoc="<!doctype html><html><body><button id='inner-btn' onclick='alert(&quot;hello from iframe&quot;)'>Alert from iframe</button></body></html>"></iframe>
<div id="log">log:</div>
<script>
window.addEventListener('message', () => {});
// Poll the inner frame's button state for outer verification
setInterval(() => {
  try {
    const b = document.getElementById('f').contentDocument.getElementById('inner-btn');
    document.getElementById('log').textContent = 'inner button present: ' + Boolean(b);
  } catch (e) { document.getElementById('log').textContent = 'cross-origin: ' + e.message; }
}, 500);
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Dialog Saturation Fixture</title>
<style>body{font-family:system-ui;padding:24px}button{display:block;margin:12px 0;padding:10px 20px;font-size:15px}
#log{background:#f4f4f4;border:1px solid #ccc;padding:12px;min-height:120px;margin-top:16px;font-family:monospace;font-size:13px;white-space:pre-wrap}</style>
</head>
<body>
<h2>Dialog Saturation Tests</h2>

<button id="b-confirm">Confirm Box</button>
<button id="b-prompt">Prompt Box (default John)</button>
<button id="b-double-prompt">Double Prompt (chained)</button>
<button id="b-delayed">Delayed Alert (3s)</button>
<button id="b-empty">Empty Alert</button>
<button id="b-huge">10KB Alert</button>

<div id="log">log:</div>
<script>
const log = (m) => { document.getElementById('log').textContent += '\n' + m; };

document.getElementById('b-confirm').onclick = () => {
  const ok = confirm('Press OK or Cancel');
  log('confirm returned: ' + ok);
};
document.getElementById('b-prompt').onclick = () => {
  const v = prompt('What is your name?', 'John');
  log('prompt returned: ' + v);
};
document.getElementById('b-double-prompt').onclick = () => {
  const a = prompt('First prompt?', 'A');
  const b = prompt('Second prompt?', 'B');
  log('double-prompt: [' + a + ', ' + b + ']');
};
document.getElementById('b-delayed').onclick = () => {
  log('clicked, alert in 3s...');
  setTimeout(() => { alert('I am the delayed alert!'); log('delayed alert done'); }, 3000);
};
document.getElementById('b-empty').onclick = () => {
  alert('');
  log('empty alert done');
};
document.getElementById('b-huge').onclick = () => {
  alert('X'.repeat(10240));
  log('huge alert (10KB) done');
};
</script>
</body>
</html>

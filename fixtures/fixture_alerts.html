<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JavaScript Alert Box Demo Fixture (replica of demo.seleniumeasy.com/javascript-alert-box-demo.html)</title>
<style>body{font-family:sans-serif;margin:40px;max-width:640px}button{display:block;margin:14px 0;padding:8px 16px}.result{color:#28a745;font-weight:bold}</style>
</head>
<body>
<h3>JavaScript Alerts</h3>

<p>1. Generate Alert Box</p>
<button id="alert-btn" onclick="myAlertFunction()">Generate Alert Box</button>
<span class="result" id="alert-result"></span>

<p>2. Confirm Box</p>
<button id="confirm-btn" onclick="myConfirmFunction()">Confirm Box</button>
<span class="result" id="confirm-result"></span>

<p>3. Prompt Box</p>
<button id="prompt-btn" onclick="myPromptFunction()">Prompt Box</button>
<span class="result" id="prompt-result"></span>

<script>
  // 与原版 demo.seleniumeasy.com/javascript-alert-box-demo.html 一致的三类弹窗逻辑
  function myAlertFunction() { alert('I am an alert box!'); document.getElementById('alert-result').textContent = 'alert shown'; }
  function myConfirmFunction() {
    var ok = confirm('Press a button!');
    document.getElementById('confirm-result').textContent = ok ? 'You pressed OK!' : 'You pressed Cancel!';
  }
  function myPromptFunction() {
    var name = prompt('Please enter your name?', 'John');
    document.getElementById('prompt-result').textContent = name ? ('You entered: ' + name) : 'You cancelled the prompt';
  }
</script>
</body>
</html>
